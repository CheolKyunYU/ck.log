baseURL = "https://CheolKyunYU.github.io/ck.log"
languageCode = "ko-KR"
title = "CK log"
theme = "PaperMod"

# 빌드 결과물을 최상단 루트로 바로 출력
publishDir = "."

# PaperMod 검색 기능(Search) 활성화를 위한 설정
[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  title = "CK log"
  description = "IT 시스템 엔지니어 CK의 실무 인프라 구축 및 트러블슈팅 블로그"
  author = "CK"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true

[languages.ko]
  languageName = "Korean"
  weight = 1
  [languages.ko.menu]
    [[languages.ko.menu.main]]
      identifier = "posts"
      name = "Posts"
      url = "/posts/"
      weight = 10
    [[languages.ko.menu.main]]
      identifier = "search"
      name = "Search"
      url = "/search/"
      weight = 20
    [[languages.ko.menu.main]]
      identifier = "tags"
      name = "Tags"
      url = "/tags/"
      weight = 30